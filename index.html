<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queen's Club Tennis Scheduler</title>
    <style>
        /* Queen's Club Style - Blue & White */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; max-width: 1100px; margin: 0 auto; padding: 20px; background-color: #f4f4f4; color: #333; }
        
        .admin-only { display: block; } 
        .public-only { display: none; } 

        body.public-view .admin-only { display: none !important; }
        body.public-view .public-only { display: block !important; }

        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #003366; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 40px; border-radius: 8px; text-align: center; width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .login-box h2 { color: #003366; margin-top: 0; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 10px; background: #003366; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        
        #app-container { display: none; }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #003366; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { color: #003366; margin: 0; font-size: 1.8em; }
        .user-controls { display: flex; align-items: center; gap: 15px; }
        .user-email { font-size: 0.9em; color: #666; font-weight: bold; }
        .logout-btn { padding: 5px 10px; background: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; }

        .public-date-display { text-align: center; color: #003366; font-size: 2.2em; margin-bottom: 20px; padding: 20px; background: white; border-radius: 8px; border-bottom: 4px solid #003366; }

        #published-dashboard { background: #eef; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ccc; }
        .pub-item { background: white; padding: 10px; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }

        .container-flex { display: flex; gap: 20px; flex-wrap: wrap; }
        .col-master { flex: 1; min-width: 300px; }
        .col-weekly { flex: 2; min-width: 400px; }

        .group-container { background: white; padding: 20px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
        .group-header { background-color: #003366; color: white; padding: 10px; border-radius: 4px 4px 0 0; margin: -20px -20px 20px -20px; }
        .master-header { background-color: #444; color: white; padding: 10px; border-radius: 4px 4px 0 0; margin: -20px -20px 20px -20px; }

        textarea { box-sizing: border-box; width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-family: monospace; }

        .button-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .action-btn { flex: 1; padding: 12px; font-weight: bold; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        #btnGenerate { background-color: #003366; } 
        #btnPublish { background-color: #e65100; } 
        #btnWord { background-color: #2b5797; }

        .resolver-box { background-color: #fff3cd; border: 2px solid #ffc107; padding: 20px; margin-top: 20px; border-radius: 8px; display: none; }
        .schedule-output { background: white; padding: 20px; margin-top: 20px; border: 1px solid #ddd; display: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; border: 2px solid #003366; }
        th { background-color: #003366; color: white; padding: 8px; }
        td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .sit-out { background-color: #eef; color: #003366; font-weight: bold; }
        
        .player-chip { display: inline-block; background-color: #e7f3fe; border: 1px solid #003366; color: #003366; padding: 4px 8px; border-radius: 15px; margin: 2px; cursor: grab; font-weight: 500; }
        .drag-hint { background-color: #fff3cd; border-left: 6px solid #ffc107; margin-bottom: 15px; padding: 10px; font-size: 0.9em; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 15% auto; padding: 20px; width: 80%; max-width: 500px; border-radius: 8px; text-align: center; }
        .modal-link { background: #eee; padding: 10px; word-break: break-all; margin: 15px 0; font-family: monospace; }
        
        .share-controls { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; max-width: 400px; margin: 30px auto; }
        .share-btn { display: block; width: 100%; padding: 15px; text-align: center; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .share-wa { background-color: #25D366; }
        .share-email { background-color: #555; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>🎾 Tennis Planner</h2>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Log In</button>
            <div id="login-msg" style="color:red; display:none; margin-top:10px;"></div>
        </div>
    </div>

    <div id="app-container">
        <div class="header-row admin-only">
            <h1>🎾 Wednesday Staggered Schedule</h1>
            <div class="user-controls">
                <span id="user-display" class="user-email"></span>
                <button class="logout-btn" onclick="logout()">Sign Out</button>
            </div>
        </div>

        <div class="public-only">
            <h1 id="publicDateHeader" class="public-date-display"></h1>
        </div>

        <div id="published-dashboard" class="admin-only" style="display:none;">
            <strong>📡 Published Schedules</strong>
            <div id="publishedList">Loading...</div>
        </div>

        <div class="admin-only">
            <label>Session Date:</label>
            <input type="date" id="sessionDate" onchange="saveDataToCloud()">

            <div class="container-flex" style="margin-top:20px;">
                <div class="col-master">
                    <div class="group-container">
                        <div class="master-header">📂 Master Player Bank (Name, Rating, M/W)</div>
                        <textarea id="masterList" rows="25" oninput="saveDataToCloud()"></textarea>
                    </div>
                </div>
                <div class="col-weekly">
                    <div class="group-container">
                        <div class="group-header">Group 1: Early (4:30 - 6:30)</div>
                        <label>Players:</label>
                        <textarea id="playersG1" rows="6" oninput="saveDataToCloud()"></textarea>
                        <label>Courts:</label>
                        <textarea id="courtsG1" rows="1" oninput="saveDataToCloud()">1, 2</textarea>
                    </div>
                    <div class="group-container">
                        <div class="group-header">Group 2: Late (5:30 - 7:30)</div>
                        <label>Players:</label>
                        <textarea id="playersG2" rows="6" oninput="saveDataToCloud()"></textarea>
                        <label>Courts:</label>
                        <textarea id="courtsG2" rows="1" oninput="saveDataToCloud()">3, 4, 5, 6</textarea>
                    </div>
                </div>
            </div>

            <div class="button-row">
                <button id="btnGenerate" class="action-btn" onclick="startGenerationProcess()">1. Generate</button>
                <button id="btnPublish" class="action-btn" onclick="publishSchedule()">2. Publish 🌐</button>
                <button id="btnWord" class="action-btn" onclick="downloadWordDoc()">3. Download Word</button>
            </div>

            <div id="resolverContainer" class="resolver-box">
                <div style="font-weight:bold; margin-bottom:10px;">⚠️ Unknown Players</div>
                <div id="resolverList"></div>
            </div>
        </div>
        
        <div id="output" class="schedule-output"></div>
        <div id="publicShareButtons" class="public-only share-controls"></div>
    </div>

    <div id="publishModal" class="modal">
        <div class="modal-content">
            <h2>✅ Published!</h2>
            <div class="modal-link" id="publishLink"></div>
            <button onclick="copyLink()">Copy Link</button>
            <button onclick="document.getElementById('publishModal').style.display='none'">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getDatabase, ref, set, push, remove, onValue, get, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZPyd_grTtcXGGBA3s7CQVGt-SXDm_QkA",
            authDomain: "project-8381867246864635545.firebaseapp.com",
            databaseURL: "https://project-8381867246864635545-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "project-8381867246864635545",
            storageBucket: "project-8381867246864635545.firebasestorage.app",
            messagingSenderId: "531514593264",
            appId: "1:531514593264:web:5ac9c140c374f63eb99735"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        let currentUser = null;

        // Attach globals
        window.login = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            try { await signInWithEmailAndPassword(auth, e, p); } 
            catch (err) { document.getElementById('login-msg').innerText = err.message; document.getElementById('login-msg').style.display='block'; }
        };
        window.logout = () => signOut(auth).then(() => window.location.reload());
        
        window.saveDataToCloud = () => {
            if (!currentUser) return;
            set(ref(db, 'users/' + currentUser.uid), {
                master: document.getElementById('masterList').value,
                p1: document.getElementById('playersG1').value,
                c1: document.getElementById('courtsG1').value,
                p2: document.getElementById('playersG2').value,
                c2: document.getElementById('courtsG2').value,
                date: document.getElementById('sessionDate').value
            });
        };

        // Router & Auth
        const urlParams = new URLSearchParams(window.location.search);
        const publicId = urlParams.get('id');

        if (publicId) {
            document.body.classList.add('public-view');
            document.getElementById('app-container').style.display = 'block';
            document.getElementById('login-overlay').style.display = 'none';
            onValue(ref(db, 'public_schedules/' + publicId), (snap) => {
                const data = snap.val();
                if (data) {
                    document.getElementById('publicDateHeader').innerText = data.date;
                    document.getElementById('output').innerHTML = data.html;
                    document.getElementById('output').style.display = 'block';
                }
            });
        } else {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('app-container').style.display = 'block';
                    document.getElementById('user-display').innerText = user.email;
                    onValue(ref(db, 'users/' + user.uid), (snap) => {
                        const d = snap.val();
                        if (d) {
                            document.getElementById('masterList').value = d.master || "";
                            document.getElementById('playersG1').value = d.p1 || "";
                            document.getElementById('courtsG1').value = d.c1 || "1, 2";
                            document.getElementById('playersG2').value = d.p2 || "";
                            document.getElementById('courtsG2').value = d.c2 || "3, 4, 5, 6";
                            document.getElementById('sessionDate').value = d.date || "";
                        }
                    });
                    loadPublishedList();
                }
            });
        }

        function loadPublishedList() {
            onValue(ref(db, 'public_schedules'), (snap) => {
                const list = document.getElementById('publishedList');
                list.innerHTML = "";
                snap.forEach(child => {
                    const d = child.val();
                    const div = document.createElement('div');
                    div.className = 'pub-item';
                    div.innerHTML = `<span>${d.date}</span> <button onclick="deleteSchedule('${child.key}')">Delete</button>`;
                    list.appendChild(div);
                });
                document.getElementById('published-dashboard').style.display = 'block';
            });
        }

        window.deleteSchedule = (key) => confirm("Delete?") && remove(ref(db, 'public_schedules/' + key));

        window.publishSchedule = async () => {
            const out = document.getElementById('output');
            if (out.style.display === 'none') return alert("Generate first.");
            const date = document.getElementById('sessionDate').value;
            const cleanHTML = out.innerHTML.replace(/draggable="true"/g, "").replace(/<div class="drag-hint">.*?<\/div>/, "");
            const newRef = push(ref(db, 'public_schedules'));
            await set(newRef, { date, html: cleanHTML });
            const link = window.location.href.split('?')[0] + "?id=" + newRef.key;
            document.getElementById('publishLink').innerText = link;
            document.getElementById('publishModal').style.display = 'block';
        };

        window.copyLink = () => navigator.clipboard.writeText(document.getElementById('publishLink').innerText).then(() => alert("Copied"));

        // WORD EXPORT FIX
        window.downloadWordDoc = function() {
            const outBox = document.getElementById('output');
            if (outBox.style.display === 'none') return alert("Generate first.");
            let cleanHTML = outBox.innerHTML.replace(/<div class="drag-hint">.*?<\/div>/, "").replace(/<span class="player-chip"[^>]*>/g, "").replace(/<\/span>/g, "");
            const dateVal = document.getElementById('sessionDate').value;
            const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><style>body{font-family:sans-serif;}table{width:100%;border-collapse:collapse;}th{background:#003366;color:white;}td,th{border:1px solid #000;padding:5px;}</style></head><body><h2>Schedule ${dateVal}</h2>${cleanHTML}</body></html>`;
            const blob = new Blob([header], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `Schedule_${dateVal}.doc`; a.click();
        };

    </script>

    <script>
        // --- LOGIC ENGINE ---
        function getMasterDatabase() {
            const db = {};
            document.getElementById('masterList').value.split('\n').forEach(line => {
                const p = line.split(',');
                if (p.length >= 2) db[p[0].trim().toLowerCase()] = { name: p[0].trim(), ability: parseFloat(p[1]), gender: (p[2]||'U').trim().toUpperCase() };
            });
            return db;
        }

        function getPairKey(a, b) { return [a.name, b.name].sort().join('|'); }
        function getQuadKeys(p1, p2, p3, p4) {
            const names = [p1.name, p2.name, p3.name, p4.name].sort();
            const pairs = [];
            for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) pairs.push(names[i] + '|' + names[j]);
            return pairs;
        }

        function determinePool(pool, cap) {
            if (pool.length <= cap) return { playing: pool, sitting: [] };
            const shuffle = (a) => a.sort(() => Math.random() - 0.5);
            const fives = shuffle(pool.filter(p => p.ability >= 5));
            const others = shuffle(pool.filter(p => p.ability < 5));
            const sit = [];
            const needed = pool.length - cap;
            while (sit.length < needed && fives.length) sit.push(fives.pop());
            while (sit.length < needed && others.length) sit.push(others.pop());
            const playing = pool.filter(p => !sit.includes(p));
            return { playing, sitting: sit };
        }

        function createMatches(pool, courts, partnerHist, nightHist) {
            pool.sort((a, b) => b.ability - a.ability);
            const matches = [];
            let temp = [...pool];
            for (let i = 0; i < courts.length; i++) {
                if (temp.length < 4) break;
                const set = [temp.shift(), temp.shift(), temp.shift(), temp.shift()];
                const combos = [{t:[[0,1],[2,3]]}, {t:[[0,2],[1,3]]}, {t:[[0,3],[1,2]]}];
                let bestSc = -999999, bestM = null;
                combos.forEach(c => {
                    const p = [set[c.t[0][0]], set[c.t[0][1]], set[c.t[1][0]], set[c.t[1][1]]];
                    let sc = 0;
                    if (partnerHist.has(getPairKey(p[0], p[1]))) sc -= 20000;
                    if (partnerHist.has(getPairKey(p[2], p[3]))) sc -= 20000;
                    let shared = 0;
                    getQuadKeys(...p).forEach(k => nightHist.has(k) && shared++);
                    if (shared > 1) sc -= (shared * 5000); 
                    const m1 = p[0].gender != p[1].gender && p[0].gender != 'U' && p[1].gender != 'U';
                    const m2 = p[2].gender != p[3].gender && p[2].gender != 'U' && p[3].gender != 'U';
                    if (m1 && m2) sc += 500;
                    sc -= Math.abs((p[0].ability + p[1].ability) - (p[2].ability + p[3].ability)) * 20;
                    if (sc > bestSc) { bestSc = sc; bestM = p; }
                });
                matches.push(bestM);
            }
            return { matches };
        }

        function startGenerationProcess() {
            const db = getMasterDatabase();
            const p1 = parse(document.getElementById('playersG1').value, db);
            const c1 = parseC(document.getElementById('courtsG1').value);
            const p2 = parse(document.getElementById('playersG2').value, db);
            const c2 = parseC(document.getElementById('courtsG2').value);

            const partnerHist = new Set(), nightHist = new Set();
            const updateH = (m) => m.forEach(match => {
                partnerHist.add(getPairKey(match[0], match[1]));
                partnerHist.add(getPairKey(match[2], match[3]));
                getQuadKeys(...match).forEach(k => nightHist.add(k));
            });

            const res1 = createMatches(determinePool(p1, c1.length * 4).playing, c1, partnerHist, nightHist);
            res1.sitOut = p1.filter(p => !res1.matches.flat().includes(p));
            updateH(res1.matches);

            const mixPool = [...p1, ...p2].filter(p => !res1.sitOut.includes(p));
            const resMix = createMatches(determinePool([...res1.sitOut, ...mixPool], (c1.length + c2.length) * 4).playing, [...c1, ...c2], partnerHist, nightHist);
            resMix.sitOut = [...p1, ...p2].filter(p => !resMix.matches.flat().includes(p));
            updateH(resMix.matches);

            const res3 = createMatches(determinePool(p2.filter(p => !resMix.sitOut.includes(p)), c2.length * 4).playing, c2, partnerHist, nightHist);
            res3.sitOut = p2.filter(p => !res3.matches.flat().includes(p));

            let h = "<div class='drag-hint'>💡 Tip: Drag names to swap.</div>";
            h += render("4:30 - 5:30", res1, c1) + "<br>" + render("5:30 - 6:30", resMix, [...c1, ...c2]) + "<br>" + render("6:30 - 7:30", res3, c2);
            document.getElementById('output').innerHTML = h;
            document.getElementById('output').style.display = 'block';
            enableDrag();
        }

        function parse(t, db) { return t.split(/[\n,]+/).map(n => db[n.trim().toLowerCase()]).filter(x => x); }
        function parseC(t) { return t.split(',').map(c => c.trim()).filter(c => c); }
        function render(time, r, cNames) {
            let t = `<h3>${time}</h3><table><tr><th>Court</th><th>Team A</th><th>Team B</th></tr>`;
            r.matches.forEach((m, i) => t += `<tr><td>${cNames[i]||(i+1)}</td><td>${chip(m[0])} & ${chip(m[1])}</td><td>${chip(m[2])} & ${chip(m[3])}</td></tr>`);
            if (r.sitOut.length) t += `<tr><td class="sit-out" colspan="3">Sit Out: ${r.sitOut.map(p => p.name).join(', ')}</td></tr>`;
            return t + "</table>";
        }
        function chip(p) { return `<span class="player-chip" draggable="true">${p.name}</span>`; }
        function enableDrag() {
            let src = null;
            document.querySelectorAll('.player-chip').forEach(el => {
                el.ondragstart = (e) => { src = el; e.dataTransfer.setData('text', el.innerHTML); };
                el.ondragover = (e) => e.preventDefault();
                el.ondrop = (e) => { if (src !== el) { const tmp = el.innerHTML; el.innerHTML = src.innerHTML; src.innerHTML = tmp; } };
            });
        }
    </script>
</body>
</html>
