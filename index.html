<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queen's Club Tennis Scheduler</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; max-width: 1100px; margin: 0 auto; padding: 20px; background-color: #f4f4f4; color: #333; }
        .admin-only { display: block; } 
        .public-only { display: none; } 
        body.public-view .admin-only { display: none !important; }
        body.public-view .public-only { display: block !important; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #003366; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 40px; border-radius: 8px; text-align: center; width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #app-container { display: none; }
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #003366; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { color: #003366; margin: 0; font-size: 1.8em; }
        .container-flex { display: flex; gap: 20px; flex-wrap: wrap; }
        .col-master { flex: 1; min-width: 300px; }
        .col-weekly { flex: 2; min-width: 400px; }
        .group-container { background: white; padding: 20px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
        .group-header { background-color: #003366; color: white; padding: 10px; border-radius: 4px 4px 0 0; margin: -20px -20px 20px -20px; }
        textarea { box-sizing: border-box; width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-family: monospace; }
        .button-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .action-btn { flex: 1; padding: 12px; font-weight: bold; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        #btnGenerate { background-color: #003366; } 
        #btnPublish { background-color: #e65100; } 
        #btnWord { background-color: #2b5797; }
        .schedule-output { background: white; padding: 20px; margin-top: 20px; border: 1px solid #ddd; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; border: 2px solid #003366; }
        th { background-color: #003366; color: white; padding: 8px; }
        td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .player-chip { display: inline-block; background-color: #e7f3fe; border: 1px solid #003366; color: #003366; padding: 4px 8px; border-radius: 15px; margin: 2px; cursor: grab; font-weight: 500; }
        .sit-out { background-color: #eef; color: #003366; font-weight: bold; font-style: italic; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>🎾 Tennis Planner</h2>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Log In</button>
            <div id="login-msg" style="color:red; display:none; margin-top:10px;"></div>
        </div>
    </div>

    <div id="app-container">
        <div class="header-row admin-only">
            <h1>🎾 Wednesday Staggered Schedule</h1>
            <button class="logout-btn" onclick="logout()">Sign Out</button>
        </div>

        <div class="admin-only">
            <input type="date" id="sessionDate" onchange="saveDataToCloud()">
            <div class="container-flex" style="margin-top:20px;">
                <div class="col-master">
                    <div class="group-container">
                        <textarea id="masterList" rows="25" placeholder="Name, Rating, M/W" oninput="saveDataToCloud()"></textarea>
                    </div>
                </div>
                <div class="col-weekly">
                    <div class="group-container">
                        <div class="group-header">Group 1: Early (4:30)</div>
                        <textarea id="playersG1" rows="6" oninput="saveDataToCloud()"></textarea>
                        <input type="text" id="courtsG1" value="1, 2" oninput="saveDataToCloud()">
                    </div>
                    <div class="group-container">
                        <div class="group-header">Group 2: Late (5:30)</div>
                        <textarea id="playersG2" rows="6" oninput="saveDataToCloud()"></textarea>
                        <input type="text" id="courtsG2" value="3, 4, 5, 6" oninput="saveDataToCloud()">
                    </div>
                </div>
            </div>

            <div class="button-row">
                <button id="btnGenerate" class="action-btn" onclick="startGenerationProcess()">1. Generate</button>
                <button id="btnPublish" class="action-btn" onclick="publishSchedule()">2. Publish 🌐</button>
                <button id="btnWord" class="action-btn" onclick="downloadWordDoc()">3. Download Word</button>
            </div>
        </div>
        
        <div id="output" class="schedule-output"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZPyd_grTtcXGGBA3s7CQVGt-SXDm_QkA",
            authDomain: "project-8381867246864635545.firebaseapp.com",
            databaseURL: "https://project-8381867246864635545-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "project-8381867246864635545",
            storageBucket: "project-8381867246864635545.firebasestorage.app",
            messagingSenderId: "531514593264",
            appId: "1:531514593264:web:5ac9c140c374f63eb99735"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        let currentUser = null;

        window.login = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            try { await signInWithEmailAndPassword(auth, e, p); } 
            catch (err) { document.getElementById('login-msg').innerText = "Login Failed"; document.getElementById('login-msg').style.display='block'; }
        };
        window.logout = () => signOut(auth).then(() => window.location.reload());
        
        window.saveDataToCloud = () => {
            if (!currentUser) return;
            set(ref(db, 'users/' + currentUser.uid), {
                master: document.getElementById('masterList').value,
                p1: document.getElementById('playersG1').value,
                c1: document.getElementById('courtsG1').value,
                p2: document.getElementById('playersG2').value,
                c2: document.getElementById('courtsG2').value,
                date: document.getElementById('sessionDate').value
            });
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                onValue(ref(db, 'users/' + user.uid), (snap) => {
                    const d = snap.val();
                    if (d) {
                        document.getElementById('masterList').value = d.master || "";
                        document.getElementById('playersG1').value = d.p1 || "";
                        document.getElementById('courtsG1').value = d.c1 || "1, 2";
                        document.getElementById('playersG2').value = d.p2 || "";
                        document.getElementById('courtsG2').value = d.c2 || "3, 4, 5, 6";
                        document.getElementById('sessionDate').value = d.date || "";
                    }
                });
            }
        });

        window.publishSchedule = async () => {
            const out = document.getElementById('output');
            const date = document.getElementById('sessionDate').value;
            const cleanHTML = out.innerHTML.replace(/draggable="true"/g, "");
            const newRef = push(ref(db, 'public_schedules'));
            await set(newRef, { date, html: cleanHTML });
            alert("Published successfully!");
        };

        window.downloadWordDoc = function() {
            const outBox = document.getElementById('output');
            if (outBox.style.display === 'none') return alert("Generate first.");
            const dateVal = document.getElementById('sessionDate').value;
            const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><style>table{width:100%;border-collapse:collapse;}th{background:#003366;color:white;}td,th{border:1px solid #000;padding:5px;text-align:center;}</style></head><body><h2>Schedule ${dateVal}</h2>${outBox.innerHTML}</body></html>`;
            const blob = new Blob([header], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `Tennis_Schedule_${dateVal}.doc`; a.click();
        };
    </script>

    <script>
        // --- LOGIC ENGINE ---
        function getMasterDatabase() {
            const db = {};
            document.getElementById('masterList').value.split('\n').forEach(line => {
                const p = line.split(',');
                if (p.length >= 2) db[p[0].trim().toLowerCase()] = { name: p[0].trim(), ability: parseFloat(p[1]), gender: (p[2]||'U').trim().toUpperCase() };
            });
            return db;
        }

        function getPairKey(a, b) { return [a.name, b.name].sort().join('|'); }
        
        function getRepeatCount(group, nightHist) {
            let count = 0;
            for (let i = 0; i < group.length; i++) {
                for (let j = i + 1; j < group.length; j++) {
                    if (nightHist.has(getPairKey(group[i], group[j]))) count++;
                }
            }
            return count;
        }

        function determinePool(pool, cap) {
            if (pool.length <= cap) return { playing: pool, sitting: [] };
            // Simple sort: bench the highest ability players first (Robin Hood rule)
            let sorted = [...pool].sort((a,b) => b.ability - a.ability);
            let sit = sorted.slice(0, pool.length - cap);
            let playing = pool.filter(p => !sit.includes(p));
            return { playing, sitting: sit };
        }

        function createMatches(pool, courts, partnerHist, nightHist) {
            let tempPool = [...pool].sort(() => Math.random() - 0.5);
            const finalMatches = [];

            for (let c = 0; c < courts.length; c++) {
                if (tempPool.length < 4) break;

                let bestGroup = null;
                let minRepeats = 99;
                let bestIdxs = [];

                // Look for a group of 4 that hasn't played together (brute-ish force first 50 attempts)
                for (let attempt = 0; attempt < 100; attempt++) {
                    let idxs = [];
                    while(idxs.length < 4) {
                        let r = Math.floor(Math.random() * tempPool.length);
                        if(!idxs.includes(r)) idxs.push(r);
                    }
                    let testGroup = idxs.map(i => tempPool[i]);
                    let repeats = getRepeatCount(testGroup, nightHist);
                    
                    if (repeats < minRepeats) {
                        minRepeats = repeats;
                        bestGroup = testGroup;
                        bestIdxs = idxs;
                    }
                    if (minRepeats === 0) break; 
                }

                // Remove selected players from temp pool
                bestIdxs.sort((a,b) => b-a).forEach(i => tempPool.splice(i, 1));

                // Now optimize teams within that group
                const g = bestGroup;
                const combos = [
                    {p: [g[0], g[1], g[2], g[3]]},
                    {p: [g[0], g[2], g[1], g[3]]},
                    {p: [g[0], g[3], g[1], g[2]]}
                ];

                let bestScore = -Infinity;
                let bestPairing = null;

                combos.forEach(c => {
                    let score = 0;
                    const p1 = c.p[0], p2 = c.p[1], p3 = c.p[2], p4 = c.p[3];
                    
                    // Penalty for repeat partners
                    if (partnerHist.has(getPairKey(p1, p2))) score -= 50000;
                    if (partnerHist.has(getPairKey(p3, p4))) score -= 50000;

                    // Heavy penalty if this combination creates a repeat court-sharing scenario
                    let reps = getRepeatCount(c.p, nightHist);
                    if (reps >= 2) score -= 1000000;

                    // Balance check
                    score -= Math.abs((p1.ability + p2.ability) - (p3.ability + p4.ability)) * 100;

                    if (score > bestScore) {
                        bestScore = score;
                        bestPairing = c.p;
                    }
                });
                finalMatches.push(bestPairing);
            }
            return { matches: finalMatches };
        }

        function startGenerationProcess() {
            const db = getMasterDatabase();
            const p1 = parse(document.getElementById('playersG1').value, db);
            const c1 = parseC(document.getElementById('courtsG1').value);
            const p2 = parse(document.getElementById('playersG2').value, db);
            const c2 = parseC(document.getElementById('courtsG2').value);

            const partnerHist = new Set();
            const nightHist = new Set();

            const updateH = (matches) => matches.forEach(m => {
                partnerHist.add(getPairKey(m[0], m[1]));
                partnerHist.add(getPairKey(m[2], m[3]));
                // Add all 6 pair combinations from the court to night history
                for(let i=0; i<4; i++) for(let j=i+1; j<4; j++) nightHist.add(getPairKey(m[i], m[j]));
            });

            // HOUR 1
            const sel1 = determinePool(p1, c1.length * 4);
            const res1 = createMatches(sel1.playing, c1, partnerHist, nightHist);
            res1.sitOut = p1.filter(p => !res1.matches.flat().includes(p));
            updateH(res1.matches);

            // MIXER HOUR
            const mixerPool = [...p1, ...p2];
            const selMix = determinePool(mixerPool, (c1.length + c2.length) * 4);
            const resMix = createMatches(selMix.playing, [...c1, ...c2], partnerHist, nightHist);
            resMix.sitOut = mixerPool.filter(p => !resMix.matches.flat().includes(p));
            updateH(resMix.matches);

            // HOUR 3
            const sel3 = determinePool(p2, c2.length * 4);
            const res3 = createMatches(sel3.playing, c2, partnerHist, nightHist);
            res3.sitOut = p2.filter(p => !res3.matches.flat().includes(p));

            let html = `<h3>4:30 PM - 5:30 PM</h3>` + render(res1, c1);
            html += `<h3>5:30 PM - 6:30 PM</h3>` + render(resMix, [...c1, ...c2]);
            html += `<h3>6:30 PM - 7:30 PM</h3>` + render(res3, c2);

            const out = document.getElementById('output');
            out.innerHTML = html;
            out.style.display = 'block';
            enableDrag();
        }

        function parse(t, db) { return t.split(/[\n,]+/).map(n => db[n.trim().toLowerCase()]).filter(x => x); }
        function parseC(t) { return t.split(',').map(c => c.trim()).filter(c => c); }
        function render(res, cNames) {
            let t = `<table><tr><th>Court</th><th>Team A</th><th>Team B</th></tr>`;
            res.matches.forEach((m, i) => {
                t += `<tr><td>${cNames[i]||(i+1)}</td><td>${chip(m[0])} & ${chip(m[1])}</td><td>${chip(m[2])} & ${chip(m[3])}</td></tr>`;
            });
            if (res.sitOut && res.sitOut.length) {
                t += `<tr><td class="sit-out" colspan="3">Sitting Out: ${res.sitOut.map(p => p.name).join(', ')}</td></tr>`;
            }
            return t + "</table>";
        }
        function chip(p) { return `<span class="player-chip" draggable="true">${p.name}</span>`; }
        function enableDrag() {
            let src = null;
            document.querySelectorAll('.player-chip').forEach(el => {
                el.ondragstart = (e) => { src = el; e.dataTransfer.setData('text', el.innerHTML); };
                el.ondragover = (e) => e.preventDefault();
                el.ondrop = (e) => { if (src !== el) { const tmp = el.innerHTML; el.innerHTML = src.innerHTML; src.innerHTML = tmp; } };
            });
        }
    </script>
</body>
</html>
